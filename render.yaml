services:
  - type: web
    name: agenda-app-event
    runtime: node
    plan: free
    autoDeploy: false
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci && npm run build
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
    healthCheckPath: /api/health
