name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        id: deploy
        run: |
          HTTP_RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -w '\n%{http_code}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys")
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          echo "Réponse Render (HTTP $HTTP_STATUS) :"
          echo "$BODY"
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Échec de la création du déploiement (HTTP $HTTP_STATUS) — vérifier RENDER_API_KEY / RENDER_SERVICE_ID"
            exit 1
          fi
          DEPLOY_ID=$(echo "$BODY" | jq -r '.id // .[0].id // empty')
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Impossible d'extraire l'id du déploiement depuis la réponse Render (voir le corps ci-dessus)"
            exit 1
          fi
          echo "Deploy id : $DEPLOY_ID"
          echo "id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish
        run: |
          for i in $(seq 1 30); do
            BODY=$(curl -fsS \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/${{ steps.deploy.outputs.id }}")
            STATUS=$(echo "$BODY" | jq -r '.status // .[0].status // empty')
            echo "Statut Render : $STATUS"
            if [ "$STATUS" = "live" ]; then
              exit 0
            fi
            if [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "::error::Déploiement Render en échec (statut: $STATUS)"
              exit 1
            fi
            sleep 20
          done
          echo "::error::Timeout en attendant la fin du déploiement Render"
          exit 1

      - name: Check health endpoint
        run: curl -fsS https://agenda-app-event.onrender.com/api/health
